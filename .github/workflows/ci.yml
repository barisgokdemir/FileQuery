name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Arayüz süzgeç testleri
        if: runner.os == 'Linux'
        run: node internal/web/jstest/suzgec_test.js
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test ./...
          else
            go test -race ./...
          fi
      - name: Gerçek klasörde örnek sorgu
        shell: bash
        run: go run ./cmd/fq "SELECT ext, COUNT(*), SUM(size) FROM '.' WHERE type = 'file' GROUP BY ext ORDER BY SUM(size) DESC LIMIT 5"

  # VERSION dosyasındaki sürümün Release'i yoksa etiketi oluşturur ve binary'leri yükler.
  # Yeni sürüm çıkarmak için VERSION dosyasındaki numarayı artırıp main'e göndermek yeterli.
  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Sürümü oku
        id: surum
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION zaten yayınlanmış, atlanıyor."
            echo "yayinla=false" >> "$GITHUB_OUTPUT"
          else
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.surum.outputs.yayinla == 'true'
        with:
          go-version-file: go.mod
      - name: Derle
        if: steps.surum.outputs.yayinla == 'true'
        env:
          VERSION: ${{ steps.surum.outputs.version }}
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            name="fq-${VERSION}-${GOOS}-${GOARCH}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "build/${name}/fq${ext}" ./cmd/fq
            cp README.md LICENSE "build/${name}/"
            if [ "$GOOS" = "windows" ]; then
              (cd build && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C build "${name}"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Kendi binary'siyle duman testi
        if: steps.surum.outputs.yayinla == 'true'
        env:
          VERSION: ${{ steps.surum.outputs.version }}
        run: |
          ./build/fq-${VERSION}-linux-amd64/fq --version
          ./build/fq-${VERSION}-linux-amd64/fq "SELECT COUNT(*) FROM '.' WHERE ext = 'go'"
      - name: GitHub Release
        if: steps.surum.outputs.yayinla == 'true'
        env:
          VERSION: ${{ steps.surum.outputs.version }}
        run: |
          # GitHub'ın otomatik notları PR başlıklarındaki @kelimeleri kullanıcı adı sanıp o kişileri
          # Contributors listesine ekler ve onlara bildirim gönderir (ör. "@resim" listesi).
          # Repo sahibi dışındaki @ifadeler kod biçimine çevrilir.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" \
            -f target_commitish="$GITHUB_SHA" --jq .body > notlar.md
          python3 - "$GITHUB_REPOSITORY_OWNER" notlar.md <<'PY'
          import re, sys
          owner, path = sys.argv[1].lower(), sys.argv[2]
          text = open(path, encoding="utf-8").read()
          def fix(m):
              return m.group(0) if m.group(1).lower() == owner else f"`@{m.group(1)}`"
          text = re.sub(r"(?<![\w`/])@([A-Za-z0-9][A-Za-z0-9-]*)", fix, text)
          open(path, "w", encoding="utf-8").write(text)
          PY
          cat notlar.md
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "FileQuery v$VERSION" --notes-file notlar.md

  # İlk sürüm (2021, PHP) için etiket ve Release oluşturur. Bir kez çalışır, sonra atlanır.
  v1-arsiv:
    name: v1 arşivi
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ETIKET: v1.0
      V1_COMMIT: 918a0866b33d38acb68627891d77c9f1d8544183
    steps:
      - uses: actions/checkout@v4
      - name: Release yoksa oluştur
        run: |
          if gh release view "$ETIKET" >/dev/null 2>&1; then
            echo "$ETIKET zaten var, atlanıyor."
            exit 0
          fi
          cat > notlar.md <<'EOF'
          FileQuery'nin 2021'de PHP ile yazılan ilk sürümü, o günkü haliyle.

          **Uyarı:** Bu sürüm form girdisiyle sunucuda dosya oluşturup silebildiği için bir web sunucusunda
          yayınlanmamalıdır. Yalnızca arşiv amaçlı tutulmaktadır; güncel sürüm için deponun ana sayfasına bakın.
          EOF
          gh release create "$ETIKET" --target "$V1_COMMIT" --title "v1.0 - PHP sürümü (2021)" --notes-file notlar.md
